<!doctype html>
<!--
  webui demo. Serve the repo root over http (ES modules don't load from file://):

    node smerp/src/server/run-server.js     mock relay on :8000
    python3 -m http.server 8080             from the repo root

  then open http://localhost:8080/webui/demo/

  Keys are never stored: open a key file or generate a new identity on each
  load. A key file is what the Identity view's Download saves: the private
  key in hex on its first line. Message history is kept in IndexedDB per
  identity, so opening the same key file again brings it back.

  The mock relay below is seeded on start.

  example add of relay (url, pubKeyHex)
  http://localhost:8000
  0xeb03b29ead5416dae89af429e77f649c3e9f8628cb032a12aa17a03e1d6bf249
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>smerp</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      color: #1b1f24;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1216; color: #e6e8eb; color-scheme: dark; }
    }
    form {
      width: min(440px, calc(100% - 32px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #8884;
      background: transparent;
      color: inherit;
    }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    button[type="submit"] { background: #2f6fec; border-color: #2f6fec; color: #fff; font-weight: 600; }
    .or { text-align: center; opacity: 0.6; }
    .error { color: #c93c37; min-height: 1.4em; }
  </style>
</head>
<body>

  <form id="login">
    <h1>smerp</h1>
    <input id="key-file" type="file" hidden>
    <button type="submit">Open key file</button>
    <div class="or">or</div>
    <button id="generate" type="button">Generate new identity</button>
    <div class="error" id="error" role="alert"></div>
  </form>

  <script type="module">
    import { PrivateIdentity } from "../../index.js";
    import { WebUi, browserSupport } from "../src/index.js";

    const form = document.getElementById("login");
    const errorLine = document.getElementById("error");

    const relays = [{
      relayUrl: "http://localhost:8000",
      relayType: "relay",
    }];

    async function open(privateKeyHex) {
      try {
        // ?debug in the URL logs the client's activity to the console.
        const debug = new URLSearchParams(location.search).has("debug");
        await new WebUi({ privateKeyHex, relays, debug }).start();
        document.head.querySelector("style").remove();
      }
      catch (error) {
        errorLine.textContent = error.message;
      }
    }

    const keyFile = document.getElementById("key-file");

    // Say up front if this browser cannot run the app, rather than fail
    // on the first click.
    browserSupport().then(support => {
      if (!support.ok) {
        errorLine.textContent = support.message;
        for (const button of form.querySelectorAll("button")) {
          button.disabled = true;
        }
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      keyFile.click();
    });

    // The private key is the first line of the file.
    keyFile.addEventListener("change", async () => {
      const [file] = keyFile.files;
      // Cleared so choosing the same file again fires change again.
      keyFile.value = "";
      if (!file) {
        return;
      }
      errorLine.textContent = "";
      const privateKeyHex = (await file.text()).split(/\r?\n/, 1)[0].trim();
      if (!privateKeyHex) {
        errorLine.textContent = "The key file's first line is empty.";
        return;
      }
      void open(privateKeyHex);
    });

    document.getElementById("generate").addEventListener("click", async () => {
      const identity = await PrivateIdentity.generate();
      void open(await identity.exportPrivateHex());
    });
  </script>

</body>
</html>
